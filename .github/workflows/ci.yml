name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Browser suites (Phase 11 accessibility + Phase 12 release E2E). Both run
  # the REAL app under wrangler dev in Chromium. NON-BLOCKING FOR NOW
  # (continue-on-error): the job needs Chromium download + wrangler dev boot
  # time and has not yet been proven stable on shared CI runners — a flaky
  # infra failure must not mask the hermetic verify signal while it beds in.
  # FLIP TO REQUIRED AT LAUNCH (docs/release/launch-checklist.md item 6):
  # remove continue-on-error and add this job to branch protection. Locally
  # both suites are green: 65/65 (a11y) + 14/14 (e2e), evidence in
  # docs/handoffs/13-release-qa-12.md SS6.
  browser-suites:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - run: npm run test:e2e

  # Lighthouse budgets (lighthouserc.json) are committed from Phase 0 but the
  # job activates in Phase 7, when frontend-engineer lands a buildable app and
  # sets the LHCI_ENABLED repository variable to 'true'. Budgets: Perf >= 90,
  # A11y >= 95, Best Practices >= 95, SEO >= 95, CLS < 0.1, LCP < 2.5s (mobile).
  # Phase 12 note: lighthouserc.json has been proven runnable (Phase 11, D6
  # fix) and all budgets are green locally — the ONLY remaining step is the
  # repo-admin action of setting LHCI_ENABLED=true (launch-checklist item 5).
  lighthouse:
    if: ${{ vars.LHCI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli autorun --config=lighthouserc.json

  # Production deploy (backtoacademy.com). Gated on the DEPLOY_ENABLED repo
  # variable, same pattern as LHCI_ENABLED above — stays off until the repo
  # owner has approved releases from main. Live resource IDs are committed in
  # wrangler.jsonc (docs/release/backtoacademy-launch-runbook.md).
  # Requires two repo SECRETS (Settings > Secrets and variables > Actions >
  # Secrets): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Only runs on
  # pushes to main that already passed `verify`, so a broken build can never
  # deploy. D1 migrations are applied explicitly before the Worker publish.
  deploy:
    # Fires on a push to main (the normal path) or a manual "Run workflow"
    # dispatch against main (docs/release/backtoacademy-launch-runbook.md
    # Step 5.7) — never on a pull_request, so fork PRs can't reach the
    # secrets below.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_ENABLED == 'true' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        # Database name must match wrangler.jsonc "database_name" exactly.
        run: npx wrangler d1 migrations apply k8-planner-fixture --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
